  <path d="M690 490 L690 590 L706 590 L706 626" fill="none" stroke="#5A6866" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="714" y="608" font-size="10.5" fill="#5A6866">describe · 1·1</text>

  <!-- ===== notas al pie ===== -->
  <line x1="34" y1="790" x2="1206" y2="790" stroke="#C9D2D0" stroke-width="1"/>
  <text x="34" y="812" font-size="11.5" fill="#16211F" font-weight="600">Las tres entidades nuevas y por qué</text>
  <text x="34" y="832" font-size="11" fill="#5A6866">DENUNCIA — la comunicación cruda conserva identidad y estado propios. Su campo «origen» es lo único que permite saber de dónde vino una denuncia ciudadana, que no tiene usuario asociado.</text>
  <text x="34" y="850" font-size="11" fill="#5A6866">COINCIDENCIA — guarda por qué dos casos se parecen: tipo, puntaje y señales. Un mismo par produce dos desenlaces opuestos: consolidar (uno queda unificado) o vincular (los dos siguen vivos).</text>
  <text x="34" y="868" font-size="11" fill="#5A6866">PARTICIPACION — separa la persona de su rol en el caso, para poder registrar que la madre denuncia por la hija mordida.</text>
  <text x="34" y="886" font-size="10.5" fill="#5A6866" font-style="italic">ANIMAL queda sin identidad propia entre casos: los datos que llegan son descriptivos, no identificatorios. Se omiten del dibujo DOCUMENTO (adjuntos) y TIPO_DENUNCIA (catálogo), que cuelgan del caso.</text>
</svg>
